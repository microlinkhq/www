name: agent routes

on:
  repository_dispatch:
    types: [vercel.deployment.promoted]
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *"

jobs:
  agentRoutes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: latest
      - name: Install
        run: pnpm install --dangerously-allow-all-builds
      - name: Verify agent routes on microlink.io
        run: pnpm vitest --no-watch test/agent-routes.js
